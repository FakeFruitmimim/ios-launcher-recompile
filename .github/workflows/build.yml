name: Build iOS Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > app-source/local.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug Full APK
      working-directory: ./app-source
      run: |
        chmod +x gradlew
        ./gradlew assembleDebugFull --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-full
        path: app-source/app/build/outputs/apk/debug/app-debug-full.apk
        if-no-files-found: error
