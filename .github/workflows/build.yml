name: Build iOS Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > app-source/local.properties

    - name: Setup Gradle 9.3.0
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.0'

    - name: Build Debug Full APK
      working-directory: ./app-source
      run: gradle assembleDebugFull --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-full
        path: app-source/app/build/outputs/apk/debug/app-debug-full.apk
        if-no-files-found: error
